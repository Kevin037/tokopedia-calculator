<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Biaya Tokopedia 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- ExcelJS CDN (full Data Validation support) -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Format Helper
        const formatIDR = (num) => {
            return 'Rp ' + Math.round(num).toLocaleString('id-ID');
        };

        const formatPercent = (num) => {
            return num.toFixed(2) + '%';
        };

        const getFormattedDateString = () => {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const now = new Date();
            const dayName = days[now.getDay()];
            const date = now.getDate();
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${dayName}, ${date} ${monthName} ${year} ${hours}:${minutes} WIB`;
        };

        // Custom Component for thousands separator formatting on-the-fly
        const FormattedNumberInput = ({ label, value, onChange, prefix = "Rp ", info = "" }) => {
            const displayValue = value ? value.toLocaleString('id-ID') : '';

            const handleChange = (e) => {
                const cleanVal = e.target.value.replace(/\D/g, '');
                const numVal = parseInt(cleanVal, 10) || 0;
                onChange(numVal);
            };

            return (
                <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">{label}</label>
                    <div className="relative">
                        {prefix && (
                            <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-medium text-sm">
                                {prefix}
                            </span>
                        )}
                        <input 
                            type="text" 
                            className="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-semibold text-slate-800"
                            value={displayValue}
                            onChange={handleChange}
                        />
                    </div>
                    {info && <p className="text-[10px] text-slate-400 mt-1">{info}</p>}
                </div>
            );
        };

        const PercentInput = ({ label, value, onChange, info = "" }) => {
            const handleNumberChange = (e) => {
                const val = parseFloat(e.target.value);
                onChange(isNaN(val) ? 0 : val);
            };

            return (
                <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">{label}</label>
                    <div className="relative">
                        <input 
                            type="number" 
                            step="0.1"
                            min="0"
                            max="100"
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-semibold text-slate-800"
                            value={value}
                            onChange={handleNumberChange}
                        />
                        <span className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 text-xs">
                            %
                        </span>
                    </div>
                    {info && <p className="text-[10px] text-slate-400 mt-1">{info}</p>}
                </div>
            );
        };

        // Stylized SVG Logo of Waras Berbisnis (Healthy Growth + WB Initials)
        const WarasLogo = () => (
            <svg className="w-10 h-10 text-emerald-100" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="6" />
                <path d="M50 20 V80 M20 50 H80" stroke="currentColor" strokeWidth="8" strokeLinecap="round" />
                <path d="M35 65 L45 55 L55 60 L70 42" fill="none" stroke="#34d399" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />
                <circle cx="70" cy="42" r="5" fill="#34d399" />
            </svg>
        );

        function App() {
            // 1. Detail Produk
            const [namaProduk, setNamaProduk] = useState("Produk Unggulan");
            const [hargaJual, setHargaJual] = useState(150000);
            const [diskonSeller, setDiskonSeller] = useState(10000);
            const [hpp, setHpp] = useState(75000);
            const [packagingCost, setPackagingCost] = useState(2500);

            // 2. Biaya Platform
            const [sellerType, setSellerType] = useState('Power Merchant Pro');
            const [platformRate, setPlatformRate] = useState(10.0);
            const [dynamicRate, setDynamicRate] = useState(2.5);
            const [logisticsFeeInput, setLogisticsFeeInput] = useState(4500);
            const [isPreOrder, setIsPreOrder] = useState(false);
            const [isNewShop, setIsNewShop] = useState(false);
            const [orderCondition, setOrderCondition] = useState('normal');

            // GMV inputs
            const [isGmvMaxActive, setIsGmvMaxActive] = useState(true);
            const [gmvMaxBudget, setGmvMaxBudget] = useState(1500000);
            const [totalGmv, setTotalGmv] = useState(40000000);
            const [isGrowthXtraActive, setIsGrowthXtraActive] = useState(true);

            // 3. Biaya Promo & Diskon (Voucher Discount Sync)
            const [voucherDiscountPercent, setVoucherDiscountPercent] = useState(2.0);
            const [voucherDiscountRupiah, setVoucherDiscountRupiah] = useState(3000);
            const [lastEditedVoucher, setLastEditedVoucher] = useState('percent'); // tracks percent vs rupiah edit source of truth
            const [adsPerOrder, setAdsPerOrder] = useState(3500);
            const [affiliateRate, setAffiliateRate] = useState(5.0);

            // 4. Target Penjualan
            const [targetMargin, setTargetMargin] = useState(25.0);
            const [dailyOrdersTarget, setDailyOrdersTarget] = useState(15);

            // Dynamic Live Date state for UI
            const [headerDate, setHeaderDate] = useState(getFormattedDateString());

            useEffect(() => {
                const interval = setInterval(() => {
                    setHeaderDate(getFormattedDateString());
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const handleVoucherPercentChange = (pct) => {
                setLastEditedVoucher('percent');
                setVoucherDiscountPercent(pct);
                setVoucherDiscountRupiah(Math.round(hargaJual * (pct / 100)));
            };

            const handleVoucherRupiahChange = (rp) => {
                setLastEditedVoucher('rupiah');
                setVoucherDiscountRupiah(rp);
                setVoucherDiscountPercent(hargaJual > 0 ? (rp / hargaJual) * 100 : 0);
            };

            // Recalculate voucher fields if Harga Jual changes based on last edited source
            useEffect(() => {
                if (lastEditedVoucher === 'percent') {
                    setVoucherDiscountRupiah(Math.round(hargaJual * (voucherDiscountPercent / 100)));
                } else {
                    setVoucherDiscountPercent(hargaJual > 0 ? (voucherDiscountRupiah / hargaJual) * 100 : 0);
                }
            }, [hargaJual]);

            const calculations = useMemo(() => {
                const basisKomisi = Math.max(0, hargaJual - diskonSeller);
                const isFailedDelivery = orderCondition === 'gagal';

                // Auto-diskon komisi platform 10% -> 8%
                const isPlatformRate10 = Math.abs(platformRate - 10) < 0.001;
                const effectiveBasicPlatformRate = isPlatformRate10 ? 8.0 : platformRate;

                // Pre-order surcharge (+3.0%)
                const preOrderExtra = isPreOrder ? 3.0 : 0.0;
                const totalPlatformRate = isFailedDelivery ? 0 : (effectiveBasicPlatformRate + preOrderExtra);

                // Raw platform platform commission
                const rawPlatformCommission = isFailedDelivery ? 0 : (basisKomisi * (totalPlatformRate / 100));

                // Program GMV Max & Growth Xtra Tier simulation
                const gmvRatio = totalGmv > 0 ? (gmvMaxBudget / totalGmv) * 100 : 0;
                const isGmvAtLeast3Percent = gmvRatio >= 3.0;

                let programTier = 'Regular (Tanpa Program)';
                let programDiscountPercent = 0;

                if (sellerType !== 'Regular Merchant') {
                    if (isGmvMaxActive && isGrowthXtraActive) {
                        if (isGmvAtLeast3Percent) {
                            programTier = 'Dual Stacked (GMV Max ≥3% + Growth Xtra)';
                            programDiscountPercent = 8.18;
                        } else {
                            programTier = 'Combined Stacked (GMV Max <3% + Growth Xtra)';
                            programDiscountPercent = 7.50; // Campaign GMV (2.70%) + Growth Xtra (4.80%)
                        }
                    } else if (isGmvMaxActive) {
                        if (isGmvAtLeast3Percent) {
                            programTier = 'GMV Max Level Toko (Budget ≥3%)';
                            programDiscountPercent = 6.45;
                        } else {
                            programTier = 'GMV Max Per Campaign (Budget <3%)';
                            programDiscountPercent = 2.70;
                        }
                    } else if (isGrowthXtraActive) {
                        programTier = 'Growth Xtra Program';
                        programDiscountPercent = 4.80;
                    }
                }

                // Program savings are computed from the basic/raw platform commission
                const programSavings = isFailedDelivery ? 0 : (rawPlatformCommission * (programDiscountPercent / 100));
                const platformCommissionEff = Math.max(0, rawPlatformCommission - programSavings);

                // Dynamic commission capped at Rp650.000 per unit
                const rawDynamicCommission = isFailedDelivery ? 0 : (basisKomisi * (dynamicRate / 100));
                const isDynamicCapped = rawDynamicCommission > 650000;
                const dynamicCommission = isFailedDelivery ? 0 : Math.min(rawDynamicCommission, 650000);

                // Fixed order processing fee (Rp1.250 or free for new shops)
                const processingFee = isFailedDelivery ? 0 : (isNewShop ? 0 : 1250);

                // Logistics Input cap at Rp 10.110 before tax
                const logisticsEff = isFailedDelivery ? 0 : Math.min(logisticsFeeInput, 10110);
                const isLogisticsCapped = logisticsFeeInput > 10110;

                // Vouchers discount
                const totalVoucherAmount = isFailedDelivery ? 0 : voucherDiscountRupiah;

                // Affiliate commission
                const affiliateCommission = isFailedDelivery ? 0 : (basisKomisi * (affiliateRate / 100));

                // Return liability (June 2026, max Rp 5.000)
                const returnFee = orderCondition === 'retur' ? 5000 : 0;

                // Total platform deductions
                const totalPlatformDeductions = platformCommissionEff + dynamicCommission + processingFee + logisticsEff + affiliateCommission;
                
                // Net Payout
                const netPayout = Math.max(0, basisKomisi - totalPlatformDeductions - totalVoucherAmount);

                // Net Profit per unit
                const totalMerchantCost = hpp + packagingCost + adsPerOrder + returnFee;
                const netProfit = netPayout - totalMerchantCost;

                // Percent metrics
                const totalPlatformDeductionPercent = basisKomisi > 0 
                    ? (((totalPlatformDeductions + totalVoucherAmount + adsPerOrder) / basisKomisi) * 100)
                    : 0;

                const effectiveCommissionPercent = basisKomisi > 0
                    ? (((platformCommissionEff + dynamicCommission) / basisKomisi) * 100)
                    : 0;

                const netMarginPercent = basisKomisi > 0
                    ? ((netProfit / basisKomisi) * 100)
                    : 0;

                // Break Even Point Calculation (Symmetric formula)
                const totalFixedFees = hpp + packagingCost + processingFee + logisticsEff + adsPerOrder + voucherDiscountRupiah + returnFee;
                const totalVariablePercent = (totalPlatformRate - (totalPlatformRate * programDiscountPercent / 100) + (dynamicRate / 100) + (affiliateRate / 100) + (voucherDiscountPercent * (hargaJual / (basisKomisi || 1))) / 100);
                
                const bepPrice = totalVariablePercent < 1 
                    ? Math.round(totalFixedFees / (1 - totalVariablePercent))
                    : hpp;

                // Proyeksi Bulanan
                const monthlyOrders = dailyOrdersTarget * 30;
                const monthlyRevenue = basisKomisi * monthlyOrders;
                const monthlyProfit = netProfit * monthlyOrders;

                // REVISI 1: Rekomendasi Jual Minimum = Total Biaya per order / (1 - Target Margin Bersih %)
                const totalCostPerOrder = hpp + packagingCost + totalPlatformDeductions + totalVoucherAmount + adsPerOrder + returnFee;
                const targetMarginDecimal = targetMargin / 100;
                
                // Rumus: Cost / (1 - Margin%)
                let rawRecommendedPrice = targetMarginDecimal < 1 
                    ? Math.round(totalCostPerOrder / (1 - targetMarginDecimal)) 
                    : hpp;
                
                // Idealnya tidak boleh kurang dari harga jual saat ini
                const recommendedPrice = Math.max(hargaJual, rawRecommendedPrice);

                return {
                    basisKomisi,
                    rawPlatformCommission,
                    programSavings,
                    platformCommissionEff,
                    rawDynamicCommission,
                    isDynamicCapped,
                    dynamicCommission,
                    processingFee,
                    logisticsEff,
                    isLogisticsCapped,
                    totalVoucherAmount,
                    affiliateCommission,
                    returnFee,
                    netPayout,
                    netProfit,
                    programTier,
                    programDiscountPercent,
                    totalPlatformDeductionPercent,
                    effectiveCommissionPercent,
                    netMarginPercent,
                    bepPrice,
                    effectivePlatformRate: totalPlatformRate * 100,
                    isPlatformRate10,
                    gmvRatio,
                    isGmvAtLeast3Percent,
                    gmvBudgetDeficit: Math.max(0, (totalGmv * 0.03) - gmvMaxBudget),
                    monthlyOrders,
                    monthlyRevenue,
                    monthlyProfit,
                    recommendedPrice,
                    totalCostPerOrder
                };
            }, [
                hargaJual, diskonSeller, hpp, packagingCost, sellerType, platformRate, 
                dynamicRate, logisticsFeeInput, isPreOrder, isNewShop, orderCondition, 
                voucherDiscountPercent, voucherDiscountRupiah, adsPerOrder, affiliateRate,
                isGmvMaxActive, gmvMaxBudget, totalGmv, isGrowthXtraActive, dailyOrdersTarget, targetMargin
            ]);

            const exportToExcel = async () => {
                // ─── ExcelJS styles ─────────────────────────────────────────
                const bdrT = { style: 'thin',   color: { argb: 'FFB7E4C7' } };
                const bdrM = { style: 'medium', color: { argb: 'FF1A3C2E' } };
                const border  = { top: bdrT, bottom: bdrT, left: bdrT, right: bdrT };
                const borderM = { top: bdrM, bottom: bdrM, left: bdrM, right: bdrM };

                const STYLES = {
                    title:      { font: { name:'Arial', size:13, bold:true,  color:{argb:'FFFFFFFF'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3C2E'}}, alignment:{horizontal:'center',vertical:'middle'} },
                    subtitle:   { font: { name:'Arial', size:9,  italic:true, color:{argb:'FF444444'} }, alignment:{horizontal:'center',vertical:'middle'} },
                    legend:     { font: { name:'Arial', size:8,  italic:true, color:{argb:'FF444444'} }, alignment:{horizontal:'left',vertical:'middle'} },
                    section:    { font: { name:'Arial', size:10, bold:true,  color:{argb:'FFFFFFFF'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF2D6A4F'}}, alignment:{horizontal:'left',vertical:'middle'} },
                    labelInput: { font: { name:'Arial', size:10, color:{argb:'FF000000'} }, border },
                    valueInput: { font: { name:'Arial', size:10, color:{argb:'FF0000CC'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9C4'}}, alignment:{horizontal:'right',vertical:'middle'}, border },
                    valueInputDD:{ font:{ name:'Arial', size:10, bold:true, color:{argb:'FF0000CC'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9C4'}}, alignment:{horizontal:'center',vertical:'middle'}, border },
                    labelAuto:  { font: { name:'Arial', size:10, color:{argb:'FF006400'} }, border },
                    valueAuto:  { font: { name:'Arial', size:10, color:{argb:'FF006400'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFD8F3DC'}}, alignment:{horizontal:'right',vertical:'middle'}, border },
                    labelFinal: { font: { name:'Arial', size:12, bold:true, color:{argb:'FFFFFFFF'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3C2E'}}, alignment:{horizontal:'left',vertical:'middle'}, border:borderM },
                    valueFinal: { font: { name:'Arial', size:12, bold:true, color:{argb:'FFFFFFFF'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3C2E'}}, alignment:{horizontal:'right',vertical:'middle'}, border:borderM },
                    labelOut:   { font: { name:'Arial', size:10 }, border },
                    statusOk:   { font: { name:'Arial', size:10, bold:true, color:{argb:'FF145A32'} }, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFEBF5EB'}}, alignment:{horizontal:'center',vertical:'middle'}, border },
                    notes:      { font: { name:'Arial', size:8,  italic:true, color:{argb:'FF555555'} }, alignment:{horizontal:'left',vertical:'middle'} }
                };

                const applyS = (cell, s) => Object.assign(cell, s);

                const wb = new ExcelJS.Workbook();
                wb.creator = 'warasberbisnis';
                const ws = wb.addWorksheet('Hasil Perhitungan');
                ws.columns = [{ width: 38 }, { width: 22 }, { width: 65 }];

                let rowNum = 0;
                let rHargaJual=0,rDiskonSeller=0,rHpp=0,rPackaging=0;
                let rSellerType=0,rPlatformRate=0,rDynamicRate=0,rLogistics=0;
                let rPreOrder=0,rIsNewShop=0,rOrderCondition=0;
                let rVoucherPercent=0,rVoucherRupiah=0,rAdsPerOrder=0,rAffiliateRate=0;
                let rGmvMaxActive=0,rGmvMaxBudget=0,rTotalGmv=0,rGrowthXtraActive=0;
                let rTargetMargin=0,rDailyOrders=0;
                let rBasisKomisi=0,rPlatformEffective=0,rRawPlatform=0,rGmvRatio=0;
                let rProgramDiscountPercent=0,rProgramSavings=0,rPlatformEffNet=0;
                let rDynamicComm=0,rProcessingFee=0,rLogisticsEff=0,rAffiliateComm=0,rReturnFee=0;
                let rPayout=0,rNetProfit=0,rMarginPercent=0,rStatus=0,rBep=0,rRecommended=0;

                const addMergedRow = (label, style, height = 22) => {
                    rowNum++;
                    ws.getRow(rowNum).height = height;
                    const cell = ws.getCell(rowNum, 1);
                    cell.value = label;
                    applyS(cell, style);
                    ws.mergeCells(rowNum, 1, rowNum, 3);
                };

                const addSection = (label) => {
                    rowNum++;
                    ws.getRow(rowNum).height = 22;
                    const cell = ws.getCell(rowNum, 1);
                    cell.value = label;
                    applyS(cell, STYLES.section);
                    ws.mergeCells(rowNum, 1, rowNum, 3);
                };

                const addInput = (label, value, numFmt, note, isDD = false) => {
                    rowNum++;
                    ws.getRow(rowNum).height = 20;
                    const cA = ws.getCell(rowNum, 1); cA.value = label; applyS(cA, STYLES.labelInput);
                    const cB = ws.getCell(rowNum, 2); cB.value = value;
                    if (numFmt) cB.numFmt = numFmt;
                    applyS(cB, isDD ? STYLES.valueInputDD : STYLES.valueInput);
                    const cC = ws.getCell(rowNum, 3); cC.value = note; applyS(cC, STYLES.notes);
                    return rowNum;
                };

                const addFormula = (label, formula, numFmt, note, isFinal = false) => {
                    rowNum++;
                    ws.getRow(rowNum).height = isFinal ? 28 : 20;
                    const cA = ws.getCell(rowNum, 1); cA.value = label; applyS(cA, isFinal ? STYLES.labelFinal : STYLES.labelAuto);
                    const cB = ws.getCell(rowNum, 2); cB.value = { formula, result: 0 };
                    if (numFmt) cB.numFmt = numFmt;
                    applyS(cB, isFinal ? STYLES.valueFinal : STYLES.valueAuto);
                    const cC = ws.getCell(rowNum, 3); cC.value = note; applyS(cC, isFinal ? STYLES.labelFinal : STYLES.notes);
                    return rowNum;
                };

                // Header
                addMergedRow('🧮 TOKOPEDIA REVISED PROFIT SIMULATOR (2026)', STYLES.title, 38);
                addMergedRow(`Diunduh pada: ${headerDate} | Hak Cipta warasberbisnis`, STYLES.subtitle, 18);
                addMergedRow('🔵 Biru = Input Bebas  |  🟢 Hijau = Formula Otomatis Dinamis', STYLES.legend, 18);
                rowNum++; ws.getRow(rowNum).height = 10;

                // Section 1
                addSection('📋 DETAIL PRODUK & KEMASAN');
                addInput('Nama Produk', namaProduk, null, 'Dapat diganti langsung');
                rHargaJual    = addInput('Harga Jual Buyer', hargaJual, '"Rp"#,##0', 'Harga sebelum potongan diskon');
                rDiskonSeller = addInput('Diskon Seller ke Buyer', diskonSeller, '"Rp"#,##0', 'Diskon langsung pemotong basis komisi');
                rHpp          = addInput('Modal / HPP Produk', hpp, '"Rp"#,##0', 'Harga pokok pembelian barang');
                rPackaging    = addInput('Biaya Packaging Pengiriman', packagingCost, '"Rp"#,##0', 'Biaya pembungkus paket');

                // Section 2
                addSection('📦 BIAYA PLATFORM TOKOPEDIA');
                rSellerType = addInput('Jenis Seller', sellerType, null, 'Regular Merchant / Power Merchant / Power Merchant Pro', true);
                ws.getCell(rSellerType, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"Regular Merchant,Power Merchant,Power Merchant Pro"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih dari dropdown.' };

                rPlatformRate = addInput('Komisi Platform Dasar (%)', platformRate, '0.0%', 'Tarif dasar komisi');
                rDynamicRate  = addInput('Komisi Dinamis (%)', dynamicRate, '0.0%', 'Tarif dinamis komisi dasar');
                rLogistics    = addInput('Biaya Layanan Logistik', logisticsFeeInput, '"Rp"#,##0', 'Biaya layanan logistik real-time');

                rPreOrder = addInput('Produk Pre-Order?', isPreOrder ? 'YA' : 'TIDAK', null, 'Ada tambahan +3.0% komisi jika YA', true);
                ws.getCell(rPreOrder, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"YA,TIDAK"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih YA atau TIDAK.' };

                rIsNewShop = addInput('Toko Baru?', isNewShop ? 'YA' : 'TIDAK', null, 'Bebas biaya pemrosesan jika YA', true);
                ws.getCell(rIsNewShop, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"YA,TIDAK"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih YA atau TIDAK.' };

                rOrderCondition = addInput('Status Kondisi Pesanan', orderCondition.toUpperCase(), null, 'NORMAL / RETUR / GAGAL', true);
                ws.getCell(rOrderCondition, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"NORMAL,RETUR,GAGAL"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih dari dropdown.' };

                // Section 3
                addSection('📣 BIAYA PROMO, PROGRAM & DISKON');
                rVoucherPercent = addInput('Voucher Diskon Seller (%)', voucherDiscountPercent, '0.00%', 'Diskon promosi toko %');
                rVoucherRupiah  = addFormula('Voucher Diskon Seller (Rp)', `=B${rHargaJual}*(B${rVoucherPercent}/100)`, '"Rp"#,##0', 'Diskon promosi toko nominal (sinkron)');
                rAdsPerOrder    = addInput('Biaya Iklan / Ads Per Order', adsPerOrder, '"Rp"#,##0', 'Alokasi pemasaran per item');
                rAffiliateRate  = addInput('Komisi Affiliate (%)', affiliateRate, '0.00%', 'Komisi affiliate program');

                rGmvMaxActive = addInput('GMV Max Aktif?', isGmvMaxActive ? 'YA' : 'TIDAK', null, 'Opsi: YA / TIDAK', true);
                ws.getCell(rGmvMaxActive, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"YA,TIDAK"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih YA atau TIDAK.' };

                rGmvMaxBudget = addInput('Budget GMV Max / Bulan', gmvMaxBudget, '"Rp"#,##0', 'Budget spend ads bulanan');
                rTotalGmv     = addInput('Total Realisasi GMV Toko / Bulan', totalGmv, '"Rp"#,##0', 'Total omset bulanan toko');

                rGrowthXtraActive = addInput('Growth Xtra Aktif?', isGrowthXtraActive ? 'YA' : 'TIDAK', null, 'Opsi: YA / TIDAK', true);
                ws.getCell(rGrowthXtraActive, 2).dataValidation = { type:'list', allowBlank:false, formulae:['"YA,TIDAK"'], showErrorMessage:true, errorTitle:'Input Tidak Valid', error:'Pilih YA atau TIDAK.' };

                // Section 4
                addSection('🎯 TARGET PENJUALAN');
                rTargetMargin = addInput('Target Margin Bersih (%)', targetMargin, '0.0%', 'Target keuntungan per pesanan');
                rDailyOrders  = addInput('Estimasi Order Per Hari (Pcs)', dailyOrdersTarget, '#,##0', 'Target volume penjualan harian');

                // Section 5
                addSection('⚡ PROSES KALKULASI OTOMATIS (FORMULA EXCEL)');
                const fFailed = `B${rOrderCondition}="GAGAL"`;
                rBasisKomisi = addFormula('Basis Perhitungan Komisi', `=MAX(0,B${rHargaJual}-B${rDiskonSeller})`, '"Rp"#,##0', 'Harga netto dikurangi diskon langsung');
                rPlatformEffective = addFormula('Persentase Platform Efektif', `=IF(${fFailed},0,IF(OR(B${rPlatformRate}=10,B${rPlatformRate}=10.0),8.0,B${rPlatformRate})+IF(B${rPreOrder}="YA",3.0,0))`, '0.0%', 'Auto diskon 10% -> 8% & surcharge PO 3%');
                rRawPlatform = addFormula('Biaya Komisi Platform Dasar', `=B${rBasisKomisi}*(B${rPlatformEffective}/100)`, '"Rp"#,##0', '');
                rGmvRatio = addFormula('Rasio GMV Max', `=IF(B${rTotalGmv}>0,B${rGmvMaxBudget}/B${rTotalGmv},0)`, '0.00%', 'Rasio budget ads vs total GMV toko');
                rProgramDiscountPercent = addFormula('Diskon Hemat Program (%)', `=IF(B${rSellerType}="Regular Merchant",0,IF(AND(B${rGmvMaxActive}="YA",B${rGrowthXtraActive}="YA"),IF(B${rGmvRatio}>=0.03,8.18,7.50),IF(B${rGmvMaxActive}="YA",IF(B${rGmvRatio}>=0.03,6.45,2.70),IF(B${rGrowthXtraActive}="YA",4.80,0))))`, '0.00%', 'Tingkat penghematan platform dari komisi dasar');
                rProgramSavings = addFormula('Total Penghematan Program', `=B${rRawPlatform}*(B${rProgramDiscountPercent}/100)`, '"Rp"#,##0', 'Dihitung dari komisi platform dasar');
                rPlatformEffNet = addFormula('Biaya Komisi Platform Netto', `=MAX(0,B${rRawPlatform}-B${rProgramSavings})`, '"Rp"#,##0', '');
                rDynamicComm = addFormula('Biaya Komisi Dinamis (Cap)', `=IF(${fFailed},0,MIN(650000,B${rBasisKomisi}*(B${rDynamicRate}/100)))`, '"Rp"#,##0', 'Capped maksimal Rp650.000/item');
                rProcessingFee = addFormula('Biaya Pemrosesan Order', `=IF(OR(${fFailed},B${rIsNewShop}="YA"),0,1250)`, '"Rp"#,##0', '');
                rLogisticsEff = addFormula('Biaya Layanan Logistik', `=IF(${fFailed},0,MIN(10110,B${rLogistics}))`, '"Rp"#,##0', 'Maksimal Rp 10.110 per transaksi');
                rAffiliateComm = addFormula('Biaya Komisi Affiliate', `=IF(${fFailed},0,B${rBasisKomisi}*(B${rAffiliateRate}/100))`, '"Rp"#,##0', '');
                rReturnFee = addFormula('Kontribusi Biaya Retur', `=IF(B${rOrderCondition}="RETUR",5000,0)`, '"Rp"#,##0', '');

                // Section 6
                addSection('💰 HASIL AKHIR & TARGET PROFIT');
                rPayout = addFormula('Dana Masuk ke Seller (Payout)', `=B${rBasisKomisi}-(B${rPlatformEffNet}+B${rDynamicComm}+B${rProcessingFee}+B${rLogisticsEff}+B${rAffiliateComm}+B${rVoucherRupiah})`, '"Rp"#,##0', 'Saldo yang ditransfer ke akun seller');
                rNetProfit = addFormula('ESTIMASI LABA BERSIH PER UNIT', `=B${rPayout}-B${rHpp}-B${rPackaging}-B${rAdsPerOrder}-B${rReturnFee}`, '"Rp"#,##0', 'Profit bersih akhir setelah semua potongan', true);
                rMarginPercent = addFormula('Margin Keuntungan Bersih (%)', `=IF(B${rBasisKomisi}>0,B${rNetProfit}/B${rBasisKomisi},0)`, '0.0%', 'Persentase margin terhadap basis komisi');

                rowNum++;
                rStatus = rowNum;
                ws.getRow(rowNum).height = 22;
                const cSA = ws.getCell(rowNum, 1); cSA.value = 'STATUS KESEHATAN MARGIN'; applyS(cSA, STYLES.labelOut);
                const cSB = ws.getCell(rowNum, 2); cSB.value = { formula: `=IF(B${rMarginPercent}>=(B${rTargetMargin}/100),"TARGET TERPENUHI ✅","DI BAWAH TARGET ⚠️")`, result: '' }; applyS(cSB, STYLES.statusOk);
                const cSC = ws.getCell(rowNum, 3); cSC.value = 'Otomatis berubah jika input target diubah'; applyS(cSC, STYLES.notes);

                rBep = addFormula('HARGA MINIMUM BREAK-EVEN (BEP)', `=ROUND((B${rHpp}+B${rPackaging}+B${rProcessingFee}+B${rLogisticsEff}+B${rAdsPerOrder}+B${rVoucherRupiah}+B${rReturnFee}-B${rDiskonSeller}*((B${rPlatformEffective}/100)*(1-(B${rProgramDiscountPercent}/100))+(B${rDynamicRate}/100)+(B${rAffiliateRate}/100)))/(1-((B${rPlatformEffective}/100)*(1-(B${rProgramDiscountPercent}/100))+(B${rDynamicRate}/100)+(B${rAffiliateRate}/100)+(B${rVoucherPercent}/100))),0)`, '"Rp"#,##0', 'Harga jual minimum agar tidak merugi', true);
                rRecommended = addFormula('REKOMENDASI JUAL MINIMUM', `=MAX(B${rHargaJual},ROUND((B${rHpp}+B${rPackaging}+B${rPlatformEffNet}+B${rDynamicComm}+B${rProcessingFee}+B${rLogisticsEff}+B${rAffiliateComm}+B${rVoucherRupiah}+B${rAdsPerOrder}+B${rReturnFee})/(1-(B${rTargetMargin}/100)),0))`, '"Rp"#,##0', 'Rekomendasi harga berdasarkan Target Margin', true);

                rowNum += 2;
                ws.getRow(rowNum).height = 18;
                const footerCell = ws.getCell(rowNum, 1);
                footerCell.value = 'File ini digenerate otomatis oleh warasberbisnis. Nilai dinamis menggunakan formula Excel murni.';
                applyS(footerCell, STYLES.notes);
                ws.mergeCells(rowNum, 1, rowNum, 3);

                const cleanName = namaProduk.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const today = new Date().toISOString().split('T')[0];
                const fileName = `Kalkulasi_Profit_${cleanName}_${today}.xlsx`;
                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen pb-16">
                    {/* Header */}
                    <header className="bg-emerald-600 text-white shadow-sm border-b border-emerald-700 py-6 px-4 mb-8">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                {/* Branding Logo Waras Berbisnis */}
                                <div className="p-1 bg-white/10 rounded-xl flex items-center justify-center">
                                    <a href="https://marketpace-tools-warasberbisnis.vercel.app">
                                        <img src="logo.png" width="80" alt="" className="rounded-xl" />
                                    </a>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-extrabold tracking-tight flex items-center gap-2">
                                        Kalkulator Tokopedia 2026
                                        <span className="text-xs bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">Regulasi Baru</span>
                                    </h1>
                                    <p className="text-xs md:text-sm text-emerald-100 mt-0.5">
                                        Simulasi profit presisi, skema GMV Max, Growth Xtra & logistik update per 1 Mei 2026 (Diakses pada: {headerDate})
                                    </p>
                                </div>
                            </div>
                            
                            {/* Action Buttons & Info - REVISI: Tombol Export diletakkan di sisi kiri dari "Perhitungan real-time tanpa submit" */}
                            <div className="flex flex-wrap items-center gap-4">
                                <button
                                    onClick={exportToExcel}
                                    className="bg-white hover:bg-emerald-50 text-emerald-700 hover:text-emerald-800 font-bold text-sm px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2 border border-emerald-200"
                                >
                                    <i className="fa-solid fa-file-excel text-lg text-emerald-600"></i>
                                    Export Excel (.xlsx)
                                </button>

                                <div className="flex items-center gap-2 text-xs text-emerald-100 bg-emerald-800/50 py-2.5 px-4 rounded-xl border border-emerald-500/20">
                                    <i className="fa-solid fa-circle-info"></i>
                                    <span>Perhitungan real-time tanpa submit</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Left Input Panel (7 cols) */}
                        <div className="lg:col-span-7 space-y-6">

                            {/* Card 1: Detail Produk & Kemasan */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                            type="text" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-semibold text-slate-800"
                                            value={namaProduk}
                                            onChange={(e) => setNamaProduk(e.target.value)}
                                            placeholder="Masukkan nama produk..."

                                    </div>

                                    <FormattedNumberInput

                                        value={hargaJual}

                                    <FormattedNumberInput

                                        value={diskonSeller}

                                    />

                                    <FormattedNumberInput

                                        onChange={setPackagingCost}

                                    />
                                </div>
                            </div>

                            {/* Card 2: Biaya Platform & Pengiriman */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <div className="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                                    <i className="fa-solid fa-shield-halved text-emerald-600"></i>
                                    <h2 className="font-bold text-slate-900">Biaya Platform & Pengiriman</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">Jenis Seller Tokopedia</label>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {['Regular Merchant', 'Power Merchant', 'Power Merchant Pro'].map((type) => (
                                                <button
                                                    key={type}

                                                    className={`px-1 py-2 rounded-lg text-[10px] font-bold border transition-all ${
                                                        sellerType === type 
                                                            ? 'border-emerald-500 bg-emerald-50 text-emerald-700 ring-2 ring-emerald-500/15'

                                                    }`}

                                            ))}
                                        </div>
                                    </div>

                                    <FormattedNumberInput 
                                        label="Biaya Layanan Logistik (Rp)" 
                                        value={logisticsFeeInput}

                                    {/* Platform rate with special 10% auto-diskon warning */}
                                    <div>

                                        {calculations.isPlatformRate10 && (

                                                🎉 Tarif 10% mendapat auto-diskon 20% dari platform → tarif efektif yang digunakan: 8%

                                    {/* Dynamic rate with cap Rp650.000 warning */}
                                    <div>
                                        <PercentInput

                                        <p className="text-[10px] text-slate-400 mt-1">

                                        </p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1.5">Kondisi Status Paket</label>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {[
                                                { id: 'normal', label: 'Normal' },
                                                { id: 'retur', label: 'Retur' },
                                                { id: 'gagal', label: 'Gagal Kirim' }
                                            ].map(cond => (
                                                <button
                                                    key={cond.id}
                                                    type="button"
                                                    onClick={() => setOrderCondition(cond.id)}
                                                    className={`py-2 rounded-lg text-xs font-bold border text-center transition-all ${
                                                        orderCondition === cond.id
                                                            ? 'border-emerald-500 bg-emerald-50 text-emerald-700 ring-2 ring-emerald-500/15'
                                                            : 'border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    {cond.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Sub-toggles inside platforms */}
                                    <div className="flex flex-col gap-3 justify-center pt-2">

                                                />
                                                <div className="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>

                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-semibold text-slate-700">Toko Baru (50 Order Free)?</span>
                                            <label className="relative inline-flex items-center cursor-pointer select-none">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only peer" 
                                                    checked={isNewShop}
                                                    onChange={(e) => setIsNewShop(e.target.checked)}
                                                />
                                                <div className="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            {/* Card 3: Biaya Promo & Diskon (Includes Voucher Sync) */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <div className="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                                    <i className="fa-solid fa-bullhorn text-emerald-600"></i>
                                    <h2 className="font-bold text-slate-900">Biaya Promo & Diskon</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    
                                    {/* Real-time linked fields with explanations */}
                                    <div>
                                        <PercentInput 
                                            label="Voucher Diskon Toko (%)" 
                                            value={voucherDiscountPercent} 
                                            onChange={handleVoucherPercentChange}

                                            Voucher toko tidak mengurangi basis komisi — hanya mengurangi penerimaan seller
                                        </p>
                                    </div>

                                    <div>
                                        <FormattedNumberInput 
                                            label="Voucher Diskon Toko (Rp)"

                                    <FormattedNumberInput

                                        value={affiliateRate} 
                                        onChange={setAffiliateRate} 
                                    />

                                </div>
                            </div>

                            {/* Seller Tier & GMV Max Program Section */}
                            {sellerType !== 'Regular Merchant' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                    <div className="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                                        <i className="fa-solid fa-gift text-emerald-600"></i>
                                        <h2 className="font-bold text-slate-900">Program Benefit Seller ({sellerType})</h2>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <span className="text-sm font-semibold text-slate-700">Aktifkan Program GMV Max?</span>
                                                <p className="text-xs text-slate-400">Hemat komisi platform dengan target threshold budget 3%</p>
                                            </div>
                                            <label className="relative inline-flex items-center cursor-pointer select-none">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only peer" 
                                                    checked={isGmvMaxActive}
                                                    onChange={(e) => setIsGmvMaxActive(e.target.checked)}
                                                />
                                                <div className="w-10 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
                                            </label>
                                        </div>

                                        {isGmvMaxActive && (
                                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">

                                                {/* Threshold analysis display */}

                                                    {calculations.isGmvAtLeast3Percent ? (
                                                        <div className="space-y-1">

                                                                Rasio GMV Max: {calculations.gmvRatio.toFixed(2)}% ✓ — memenuhi threshold, diskon berlaku seluruh toko
                                                            </span>

                                                                Diskon komisi berlaku untuk semua produk di toko, termasuk yang tidak ada campaign aktif (s/d 6,45%)

                                                    ) : (

                                                                Rasio GMV Max: {calculations.gmvRatio.toFixed(2)}% — belum memenuhi threshold 3%
                                                            </span>
                                                            <p className="text-xs text-slate-600 font-medium">

                                                            </p>
                                                            <p className="text-xs text-rose-600 font-bold">
                                                                ⚠️ Tambah budget <span className="underline">{formatIDR(calculations.gmvBudgetDeficit)}</span> lagi untuk mencapai threshold diskon seluruh toko (3%).
                                                            </p>
