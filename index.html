                                )}

                                {orderCondition === 'retur' && (
                                    <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 flex gap-3 text-rose-800">
                                        <i className="fa-solid fa-rotate-left text-rose-600 mt-1"></i>
                                        <div>
                                            <h4 className="font-bold text-xs">Simulasi Pesanan Diretur</h4>
                                            <p className="text-[11px] mt-0.5">Semua biaya platform tetap dipotong, dan seller berkontribusi menanggung ongkos kirim retur Rp5.000.</p>
                                        </div>
                                    </div>
                                )}

                                {orderCondition === 'gagal' && (
                                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 flex gap-3 text-blue-800">
                                        <i className="fa-solid fa-circle-info text-blue-600 mt-1"></i>
                                        <div>
                                            <h4 className="font-bold text-xs">Pesanan Gagal Kirim</h4>
                                            <p className="text-[11px] mt-0.5">Seluruh komisi, ongkir, voucher, dan biaya administrasi dibatalkan (Rp0).</p>
                                        </div>
                                    </div>
                                )}

                                {isPreOrder && (
                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex gap-2 text-amber-800">
                                        <i className="fa-solid fa-clock text-amber-600 mt-0.5"></i>
                                        <span className="text-[11px]">Surcharge pre-order <strong>+3.00%</strong> aktif pada komisi platform.</span>
                                    </div>
                                )}
                            </div>

                            {/* Detailed Calculations Breakdown Card */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <h3 className="font-bold text-slate-900 mb-4 text-base">Rincian Perhitungan (Real-time)</h3>
                                
                                <div className="space-y-2.5 text-sm">
                                    <div className="flex justify-between items-center py-1">
                                        <span className="text-slate-500 font-medium">Harga Jual Buyer</span>
                                        <span className="font-bold text-slate-800">{formatIDR(hargaJual)}</span>
                                    </div>
                                    <div className="flex justify-between items-center py-1 border-b border-dashed border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium">- Diskon Seller</span>
                                        <span className="font-semibold text-rose-600">{formatIDR(diskonSeller)}</span>
                                    </div>
                                    <div className="flex justify-between items-center py-1 bg-slate-50 px-2.5 rounded-lg border border-slate-100">
                                        <span className="text-slate-700 font-bold">Basis Komisi (Harga Netto)</span>
                                        <span className="font-extrabold text-emerald-700">{formatIDR(calculations.basisKomisi)}</span>
                                    </div>

                                    {/* Platform Commission details - POIN 1 */}
                                    <div className="flex justify-between items-start py-1 pt-2">
                                        <div>
                                            <span className="text-slate-500 font-medium flex items-center gap-1">
                                                - Komisi Platform ({calculations.isPlatformRate10 ? '10% → efektif 8%' : platformRate.toFixed(2) + '%'})
                                            </span>
                                            {isPreOrder && (
                                                <p className="text-[9px] text-amber-600 font-medium">*Termasuk komisi PO +3.00%</p>
                                            )}
                                        </div>
                                        <span className="font-semibold text-rose-600">{formatIDR(calculations.platformCommissionEff)}</span>
                                    </div>

                                    {/* Program Savings - POIN 3 GMV Max details */}
                                    {calculations.programSavings > 0 && (
                                        <div className="flex flex-col py-1 text-emerald-600 bg-emerald-50/50 px-2.5 rounded-lg border border-emerald-100">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-semibold">+ Hemat Program ({calculations.programTier})</span>
                                                <span className="font-bold text-xs">+{formatIDR(calculations.programSavings)}</span>
                                            </div>
                                            <p className="text-[9px] text-emerald-700 mt-0.5">
                                                *Dihitung dari nilai komisi platform, bukan dari harga jual
                                            </p>
                                        </div>
                                    )}

                                    {/* Dynamic Commission - POIN 2 with Rp650.000 capping information */}
                                    <div className="flex justify-between items-start py-1">
                                        <div>
                                            <span className="text-slate-500 font-medium">
                                                - Komisi Dinamis ({dynamicRate.toFixed(2)}%)
                                            </span>
                                            {calculations.isDynamicCapped && (
                                                <p className="text-[10px] text-blue-600 font-medium">
                                                    *Rp650.000 (capped dari {formatIDR(calculations.rawDynamicCommission)})
                                                </p>
                                            )}
                                        </div>
                                        <span className="font-semibold text-rose-600">{formatIDR(calculations.dynamicCommission)}</span>
                                    </div>

                                    {/* Fixed Platform Charges */}
                                    <div className="flex justify-between items-center py-1">
                                        <span className="text-slate-500 font-medium">
                                            - Biaya Pemrosesan Order
                                        </span>
                                        <span className="font-semibold text-rose-600">
                                            {calculations.processingFee === 0 ? 'Gratis' : formatIDR(calculations.processingFee)}
                                        </span>
                                    </div>

                                    {/* Logistics */}
                                    <div className="flex justify-between items-start py-1 border-b border-dashed border-slate-100 pb-2">
                                        <div>
                                            <span className="text-slate-500 font-medium">
                                                - Biaya Layanan Logistik
                                            </span>
                                            {calculations.isLogisticsCapped && (
                                                <p className="text-[9px] text-blue-600 font-medium">*Dicap Rp10.110 maks sebelum pajak</p>
                                            )}
                                        </div>
                                        <span className="font-semibold text-rose-600">{formatIDR(calculations.logisticsEff)}</span>
                                    </div>

                                    {/* Promos, Vouchers, and Ads */}
                                    <div className="flex justify-between items-center py-1">
                                        <span className="text-slate-500 font-medium">
                                            - Total Voucher Diskon Toko
                                        </span>
                                        <span className="font-semibold text-rose-600">{formatIDR(calculations.totalVoucherAmount)}</span>
                                    </div>

                                    <div className="flex justify-between items-center py-1">
                                        <span className="text-slate-500 font-medium">
                                            - Alokasi Biaya Iklan / Unit
                                        </span>
                                        <span className="font-semibold text-rose-600">{formatIDR(adsPerOrder)}</span>
                                    </div>

                                    <div className="flex justify-between items-center py-1 border-b border-dashed border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium">
                                            - Komisi Affiliate ({affiliateRate.toFixed(2)}%)
                                        </span>
                                        <span className="font-semibold text-rose-600">{formatIDR(calculations.affiliateCommission)}</span>
                                    </div>

                                    {orderCondition === 'retur' && (
                                        <div className="flex justify-between items-center py-1 border-b border-dashed border-slate-100 pb-2 text-rose-600">
                                            <span className="font-medium">- Kontribusi Biaya Retur</span>
                                            <span className="font-bold">{formatIDR(calculations.returnFee)}</span>
                                        </div>
                                    )}

                                    {/* Total Payout */}
                                    <div className="flex justify-between items-center py-1 bg-slate-50 px-2.5 rounded-lg border border-slate-100">
                                        <span className="text-slate-700 font-bold">Dana Masuk ke Seller (Payout)</span>
                                        <span className="font-extrabold text-emerald-700">{formatIDR(calculations.netPayout)}</span>
                                    </div>

                                    <div className="flex justify-between items-center py-1">
                                        <span className="text-slate-500 font-medium">- Modal / HPP Produk</span>
                                        <span className="font-semibold text-rose-600">{formatIDR(hpp)}</span>
                                    </div>

                                    <div className="flex justify-between items-center py-1 border-b border-dashed border-slate-100 pb-2">
                                        <span className="text-slate-500 font-medium">- Biaya Packaging Pengiriman</span>
                                        <span className="font-semibold text-rose-600">{formatIDR(packagingCost)}</span>
                                    </div>

                                    {/* Final Net Profit */}
                                    <div className="flex justify-between items-center py-3 border-t-2 border-slate-200 mt-2">
                                        <span className="text-base font-extrabold text-slate-800">ESTIMASI LABA BERSIH</span>
                                        <span className={`text-lg font-black ${calculations.netProfit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                            {formatIDR(calculations.netProfit)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="mt-16 py-8 border-t border-slate-200 bg-white">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <img src="logo.png" width="80" />
                                <div>
                                    <span className="text-sm font-bold text-slate-800 block">Kalkulator Tokopedia 2026</span>
                                    <span className="text-xs text-slate-500">Powering Smart Commerce Sellers</span>
                                </div>
                            </div>
                            <div className="text-xs text-slate-500 text-center md:text-right">
                                &copy; 2026 Dibuat oleh <a href="https://www.instagram.com/warasberbisnis/" target="_blank" rel="noopener noreferrer" class="text-emerald-600 hover:text-emerald-700 font-extrabold underline inline-flex items-center gap-1">
                                    <i className="fa-brands fa-instagram text-sm"></i>
                                    warasberbisnis
                                </a>. Semua Hak Cipta Dilindungi.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
